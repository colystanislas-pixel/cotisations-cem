<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cotisations – CEM Zone Sud</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#18202e;--mu:#667085;--bd:#d9dee6;--ac:#0f7a5c;--ac2:#e3f3ed;--bad:#b4372b;--bad2:#fbeae8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--card:#19212c;--tx:#e8ecf2;--mu:#9aa5b5;--bd:#2c3746;--ac:#3ec99d;--ac2:#173529;--bad:#ff8b7d;--bad2:#3a1d1a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151c;--card:#19212c;--tx:#e8ecf2;--mu:#9aa5b5;--bd:#2c3746;--ac:#3ec99d;--ac2:#173529;--bad:#ff8b7d;--bad2:#3a1d1a;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:14px}
.w{max-width:1100px;margin:0 auto}
h1{font-size:20px;margin:0}.sub{color:var(--mu);font-size:13px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 11px}
button{cursor:pointer}button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
button.d{color:var(--bad)}button.s{padding:4px 8px;font-size:13px}
a.btn{display:inline-block;text-decoration:none;background:#1fa855;color:#fff;font-weight:600;border-radius:8px;padding:9px 14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
.st b{display:block;font-size:19px}.st span{color:var(--mu);font-size:12px}
.bar{height:6px;background:var(--bd);border-radius:4px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:center;white-space:nowrap}
th{font-size:12px;color:var(--mu);background:var(--bg)}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
th:first-child{background:var(--bg)}
.c{width:44px;height:32px;padding:0;font-weight:700;border-radius:6px}
.c.y{background:var(--ac2);color:var(--ac);border-color:var(--ac)}.c.n{background:var(--bad2);color:var(--bad);border-color:transparent}
.ok{color:var(--ac);font-weight:600}.ko{color:var(--bad)}
tfoot td{font-weight:600;background:var(--bg)}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);max-width:520px;width:92%;padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 10px;font-size:17px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
dialog input,dialog select,dialog textarea{width:100%}
textarea{font:12px monospace;min-height:120px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px}
.empty{padding:26px;text-align:center;color:var(--mu)}
a.btn{display:inline-block;text-decoration:none;background:var(--ac);color:#fff;font-weight:600;border-radius:8px;padding:8px 14px}
@media print{.noprint{display:none!important}body{padding:0}}
</style></head><body><div class="w">
<div class="top">
 <div><h1>Cotisations de fin d’année – CEM Zone Sud</h1><div class="sub" id="sub"></div></div>
 <div class="row noprint"><select id="ys" onchange="setYear(this.value)"></select>
 <button onclick="newYear()">+ Nouvelle année</button><button onclick="settings()">⚙ Paramètres</button></div>
</div>
<div class="stats" id="stats"></div>
<div class="row noprint" style="margin-bottom:10px">
 <input id="q" placeholder="Rechercher un agent…" oninput="table()" style="flex:1;min-width:150px">
 <button class="p" onclick="addAgent()">+ Ajouter un agent</button><button onclick="seedAgents()">↺ Remettre la liste</button>
 <button onclick="msgAll()">💬 WhatsApp : situation générale</button><button class="p" onclick="wa()">📲 WhatsApp</button><button onclick="csv()">Export CSV</button><button onclick="backup()">Sauvegarde</button><button onclick="window.print()">Imprimer</button><button class="d" onclick="wipe()">🗑 Tout effacer</button>
</div>
<div class="tw" id="tw"></div>
<p class="sub noprint">Cliquez sur une case pour marquer un mois comme payé (✓) ou non payé. Les données sont enregistrées automatiquement dans ce navigateur : pensez à faire une « Sauvegarde » régulièrement.</p>
</div>
<dialog id="dlg"></dialog>
<script>
const MN=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
const KEY="cotis_cem_zone_sud_v1";
const SEED=["Ndeye Katy AMINE","Oumar BA","Francisca Pulcherie BADJI","Aliou BODIAN","Stanislas Marien COLY","Maïmouna DIA","Moussa DIAGNE","Assane DIAO","Ariette DIATTA","Hyacinth DIATTA","Syaka DIEME","Mor DIENE","Salimata DIENE","Bernard Latyr DIOME","Ablaye DIONE","Cecile Mane DIONE","William Diegane DIONE","Fatou Binetou DIOP","Malick DIOP","Maurice DIOP","Diarietou DIOUF","Djiby (EPS) DIOUF","Djiby (SP) DIOUF","Jean Pierre Cora DIOUF","Ndeye Siga DIOUF","Mamadou FAYE","Papa Mbar FAYE","Marcel GOMIS","Ndèye Thiébo GUEYE","Elhadji KAMA","Lamine MANE","Mamadou MBALLO","Aissatou Dite Mame Thioro NDIAYE","Boure NDOUR","El Hadji Oumar SARR","Waly Blaise SENE","Malang Toura SOUANE","Awa SOW","Caro THIOUNE","Binta TINE"];
let db=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>n.toLocaleString("fr-FR").replace(/\u202f/g," ")+" F";
const lab=Y=>Y.start+"-"+(Y.start+1);
function mkYear(y,agents){return{start:y,amount:2000,sm:10,em:5,agents:agents||[]}}
function load(){try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){db=null}
 if(!db||!db.years){db={current:"2026-2027",years:{"2026-2027":mkYear(2026)}}}
 const Y0=db.years["2026-2027"];if(Y0&&!Y0.agents.length&&!db.seeded){Y0.agents=SEED.map(n=>({name:n,role:"",paid:{}}));db.seeded=true;save()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
function cur(){return db.years[db.current]}
function months(Y){const r=[];let y=Y.start,m=Y.sm;
 for(let i=0;i<24;i++){r.push({k:y+"-"+String(m+1).padStart(2,"0"),l:MN[m]});
  if(m===Y.em&&y>=Y.start+(Y.em<Y.sm?1:0))break;m++;if(m>11){m=0;y++}}return r}
function modal(title,body,ok,label){const d=$("dlg");
 d.innerHTML=`<h2>${title}</h2>${body}<div class="row" style="margin-top:14px;justify-content:flex-end"><button onclick="$('dlg').close()">${ok?"Annuler":"Fermer"}</button>${ok?`<button class="p" id="okb">${label||"Valider"}</button>`:""}</div>`;
 if(ok)$("okb").onclick=()=>{if(ok()!==false)d.close()};
 d.showModal()}
function head(){const Y=cur(),M=months(Y);
 $("ys").innerHTML=Object.keys(db.years).sort().map(k=>`<option ${k===db.current?"selected":""}>${k}</option>`).join("");
 $("sub").textContent=`Année scolaire ${db.current} · ${fmt(Y.amount)} par mois · ${M[0].l} à ${M[M.length-1].l} (${M.length} mois)`}
function setYear(k){db.current=k;save();render()}
function tog(i,k){const a=cur().agents[i];a.paid=a.paid||{};if(a.paid[k])delete a.paid[k];else a.paid[k]=new Date().toISOString().slice(0,10);save();stats();table()}
function stats(){const Y=cur(),M=months(Y),n=Y.agents.length;let p=0;
 Y.agents.forEach(a=>M.forEach(m=>{if(a.paid&&a.paid[m.k])p++}));
 const exp=n*M.length*Y.amount,col=p*Y.amount,pc=exp?Math.round(col/exp*100):0;
 $("stats").innerHTML=`<div class="st"><b>${n}</b><span>Agents</span></div>
 <div class="st"><b>${fmt(Y.amount*M.length)}</b><span>Total par agent</span></div>
 <div class="st"><b class="ok">${fmt(col)}</b><span>Collecté</span></div>
 <div class="st"><b class="ko">${fmt(exp-col)}</b><span>Reste à collecter</span></div>
 <div class="st"><b>${pc} %</b><span>Taux de recouvrement</span><div class="bar"><i style="width:${pc}%"></i></div></div>`}
function table(){const Y=cur(),M=months(Y),q=$("q").value.toLowerCase();
 const rows=Y.agents.map((a,i)=>({a,i})).filter(r=>(r.a.name+" "+(r.a.role||"")).toLowerCase().includes(q));
 if(!Y.agents.length){$("tw").innerHTML=`<div class="empty">Aucun agent pour le moment.<br><br><button class="p" onclick="seedAgents()">↺ Remettre la liste des 40 agents</button></div>`;return}
 const tot=Y.amount*M.length;
 let h=`<table><thead><tr><th>Agent</th>${M.map(m=>`<th>${m.l.slice(0,4)}.</th>`).join("")}<th>Payé</th><th>Reste</th><th class="noprint"></th></tr></thead><tbody>`;
 rows.forEach(({a,i},n)=>{const c=M.filter(m=>a.paid&&a.paid[m.k]).length;
  h+=`<tr><td>${n+1}. ${esc(a.name)}${a.role?`<div class="sub">${esc(a.role)}</div>`:""}</td>${M.map(m=>{const y=a.paid&&a.paid[m.k];
   return`<td><button class="c ${y?"y":"n"}" title="${y?"Payé le "+a.paid[m.k]:"Non payé"}" onclick="tog(${i},'${m.k}')">${y?"✓":"–"}</button></td>`}).join("")}
  <td class="ok">${fmt(c*Y.amount)}</td><td class="${c===M.length?"ok":"ko"}">${c===M.length?"Soldé":fmt(tot-c*Y.amount)}</td>
  <td class="noprint"><button class="s" title="Envoyer sa situation par WhatsApp" onclick="msgAgent(${i})">💬</button> <button class="s" onclick="editAgent(${i})">✎</button> <button class="s d" onclick="delAgent(${i})">✕</button></td></tr>`});
 h+=`</tbody><tfoot><tr><td>Total par mois</td>${M.map(m=>{const c=rows.filter(r=>r.a.paid&&r.a.paid[m.k]).length;return`<td>${c}/${rows.length}<div class="sub">${fmt(c*Y.amount)}</div></td>`}).join("")}<td colspan="3"></td></tr></tfoot></table>`;
 $("tw").innerHTML=h}
function render(){head();stats();table()}
function agentForm(a){return`<label>Nom complet</label><input id="fn" value="${esc(a.name||"")}"><label>Numéro WhatsApp (facultatif)</label><input id="ft" type="tel" value="${esc(a.tel||"")}" placeholder="77 123 45 67"><label>Fonction (facultatif)</label><input id="fr" value="${esc(a.role||"")}" placeholder="Professeur, surveillant, etc.">`}
function addAgent(){modal("Ajouter un agent",agentForm({}),()=>{const n=$("fn").value.trim();if(!n)return false;
 cur().agents.push({name:n,role:$("fr").value.trim(),tel:$("ft").value.trim(),paid:{}});save();render()})}
function editAgent(i){const a=cur().agents[i];modal("Modifier l’agent",agentForm(a),()=>{const n=$("fn").value.trim();if(!n)return false;
 a.name=n;a.role=$("fr").value.trim();a.tel=$("ft").value.trim();save();render()})}
function delAgent(i){const a=cur().agents[i];modal("Supprimer l’agent",`<p>Supprimer <b>${esc(a.name)}</b> et tous ses paiements de l’année ${db.current} ?</p>`,()=>{cur().agents.splice(i,1);save();render()},"Supprimer")}
function settings(){const Y=cur(),o=s=>MN.map((m,i)=>`<option value="${i}" ${i===s?"selected":""}>${m}</option>`).join("");
 modal("Paramètres de l’année "+db.current,`<label>Montant mensuel par agent (F CFA)</label><input id="sa" type="number" min="0" step="100" value="${Y.amount}">
 <label>Premier mois de cotisation</label><select id="ssm">${o(Y.sm)}</select><label>Dernier mois de cotisation</label><select id="sem">${o(Y.em)}</select>
 <p class="sub">Les paiements déjà saisis sont conservés si vous modifiez la période.</p>`,()=>{
  Y.amount=Math.max(0,parseInt($("sa").value)||0);Y.sm=+$("ssm").value;Y.em=+$("sem").value;save();render()})}
function newYear(){const ks=Object.keys(db.years),s=Math.max(...ks.map(k=>db.years[k].start))+1,k=s+"-"+(s+1);
 modal("Nouvelle année scolaire",`<p>Créer l’année <b>${k}</b> ?</p><label>Liste des agents</label><select id="cp"><option value="1">Reprendre les agents de ${db.current} (paiements remis à zéro)</option><option value="0">Commencer avec une liste vide</option></select>
 <p class="sub">L’année précédente reste consultable à tout moment dans le menu en haut.</p>`,()=>{
  const ag=$("cp").value==="1"?cur().agents.map(a=>({name:a.name,role:a.role,tel:a.tel||"",paid:{}})):[];
  const prev=cur();db.years[k]={start:s,amount:prev.amount,sm:prev.sm,em:prev.em,agents:ag};db.current=k;save();render()},"Créer")}
function csv(){const Y=cur(),M=months(Y);
 const L=[["Agent","Fonction",...M.map(m=>m.l),"Payé (F)","Reste (F)"]];
 Y.agents.forEach(a=>{const c=M.filter(m=>a.paid&&a.paid[m.k]).length;L.push([a.name,a.role||"",...M.map(m=>a.paid&&a.paid[m.k]?"Payé":""),c*Y.amount,(M.length-c)*Y.amount])});
 modal("Export CSV – "+db.current,`<p class="sub">Copiez ce texte et collez-le dans Excel ou un fichier .csv.</p><textarea id="ta" readonly>${esc(L.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";")).join("\n"))}</textarea>`);$("ta").select()}
function backup(){modal("Sauvegarde et restauration",`<label>Sauvegarde : copiez ce texte et conservez-le (WhatsApp, e-mail, fichier)</label><textarea id="ta" readonly>${esc(JSON.stringify(db))}</textarea>
 <label>Restauration : collez ici une sauvegarde (remplace toutes les données actuelles)</label><textarea id="tb"></textarea>`,()=>{
  const v=$("tb").value.trim();if(!v)return true;try{const d=JSON.parse(v);if(!d.years||!d.current)throw 0;db=d;save();render()}catch(e){$("tb").style.borderColor="var(--bad)";return false}},"Restaurer")}
function phone(t){let d=String(t||"").replace(/\D/g,"");if(d.length===9&&d[0]==="7")d="221"+d;return d}
function msgAgent(i){const a=cur().agents[i],Y=cur(),M=months(Y),c=M.filter(m=>a.paid&&a.paid[m.k]).length;
 const t=`*Cotisation sortie de fin d’année – CEM Zone Sud*\nAnnée scolaire ${db.current}\n\nBonjour ${a.name},\nVoici votre situation (${fmt(Y.amount)} par mois) :\n\n`+M.map(m=>(a.paid&&a.paid[m.k]?"✅ ":"❌ ")+m.l).join("\n")+`\n\nPayé : ${fmt(c*Y.amount)}\nReste à payer : ${fmt((M.length-c)*Y.amount)}`+(c===M.length?"\n\n🎉 Vous êtes à jour, merci !":"\n\nMerci de régulariser.");
 share("Situation de "+esc(a.name),t,phone(a.tel),a.tel?"":"Aucun numéro enregistré pour cet agent : WhatsApp vous laissera choisir le contact.")}
function msgAll(){const Y=cur(),M=months(Y);let col=0;
 const L=Y.agents.map((a,i)=>{const c=M.filter(m=>a.paid&&a.paid[m.k]).length;col+=c;
  return `${i+1}. ${a.name} : ${fmt(c*Y.amount)} payé`+(c===M.length?" ✅ soldé":` | reste ${fmt((M.length-c)*Y.amount)}`)});
 const exp=Y.agents.length*M.length*Y.amount;
 const t=`*Cotisation sortie de fin d’année – CEM Zone Sud*\nAnnée scolaire ${db.current} (${fmt(Y.amount)}/mois, ${M[0].l} à ${M[M.length-1].l})\n\n`+L.join("\n")+`\n\n*Total collecté : ${fmt(col*Y.amount)} sur ${fmt(exp)}*`;
 share("Situation générale",t,"","WhatsApp vous laissera choisir le groupe ou le contact.")}
function share(title,txt,ph,note){modal(title,`<label>Message (vous pouvez le modifier avant l’envoi)</label><textarea id="ta" style="min-height:230px">${esc(txt)}</textarea>${note?`<p class="sub">${note}</p>`:""}<div style="margin-top:10px"><a class="btn" target="_blank" rel="noopener" href="https://wa.me/${ph}" onclick="this.href='https://wa.me/${ph}?text='+encodeURIComponent($('ta').value)">Ouvrir WhatsApp</a></div>`)}
function wa(){modal("Envoyer par WhatsApp",`<label>Type de message</label><select id="wt"><option value="m">Situation d’un mois</option><option value="g">Situation générale à ce jour</option><option value="f">Récapitulatif de fin d’année</option><option value="a">Situation d’un agent</option></select><div id="wv"></div><label>Aperçu (vous pouvez le modifier)</label><textarea id="wx" style="min-height:230px"></textarea><div class="row" style="margin-top:8px"><a id="wl" class="btn" target="_blank" rel="noopener">Ouvrir WhatsApp</a><button type="button" onclick="cp()">Copier le texte</button></div><p class="sub">WhatsApp s’ouvre avec le message prêt : choisissez le groupe des agents puis envoyez.</p>`);
 $("wt").onchange=waUI;$("wx").oninput=waLink;waUI()}
function waUI(){const Y=cur(),M=months(Y),t=$("wt").value;
 $("wv").innerHTML=t==="m"?`<label>Mois</label><select id="wsel">${M.map((m,i)=>`<option value="${i}">${m.l}</option>`).join("")}</select>`:t==="a"?`<label>Agent</label><select id="wsel">${Y.agents.map((a,i)=>`<option value="${i}">${esc(a.name)}</option>`).join("")}</select>`:"";
 if($("wsel")){if(t==="m"){let l=0;M.forEach((m,i)=>{if(Y.agents.some(a=>a.paid&&a.paid[m.k]))l=i});$("wsel").value=l}$("wsel").onchange=waTxt}
 waTxt()}
function waTxt(){$("wx").value=waMsg($("wt").value,$("wsel")?+$("wsel").value:0);waLink()}
function waLink(){$("wl").href="https://wa.me/?text="+encodeURIComponent($("wx").value)}
function cp(){const t=$("wx");t.select();try{navigator.clipboard.writeText(t.value)}catch(e){}try{document.execCommand("copy")}catch(e){}}
function waMsg(t,v){const Y=cur(),M=months(Y),A=Y.agents,am=Y.amount,P=(a,m)=>a.paid&&a.paid[m.k];
 const H=`*CEM ZONE SUD – Cotisation sortie de fin d’année*\nAnnée scolaire ${db.current} · ${fmt(am)} par mois et par agent\n\n`;
 const list=(r,f)=>r.length?r.map((a,i)=>`${i+1}. ${f(a)}`).join("\n"):"—";
 const nb=a=>M.filter(m=>P(a,m)).length;
 const col=A.reduce((s,a)=>s+nb(a),0)*am,exp=A.length*M.length*am,pc=exp?Math.round(col/exp*100):0;
 if(t==="m"){const m=M[v],ok=A.filter(a=>P(a,m)),ko=A.filter(a=>!P(a,m));
  return H+`📅 *Situation de ${m.l}*\n\n✅ *Ont payé (${ok.length}/${A.length})*\n${list(ok,a=>a.name)}\n\n⏳ *N’ont pas encore payé (${ko.length})*\n${list(ko,a=>a.name)}\n\n💰 Collecté en ${m.l} : *${fmt(ok.length*am)}*\n💼 Total en caisse à ce jour : *${fmt(col)}*\n\nMerci à tous 🙏`}
 if(t==="g")return H+`📊 *Situation générale à ce jour*\n\n${list(A,a=>`${a.name} : ${nb(a)}/${M.length} mois · ${fmt(nb(a)*am)}`)}\n\n💼 Total en caisse : *${fmt(col)}* sur ${fmt(exp)} (${pc} %)\n\nMerci à tous 🙏`;
 if(t==="a"){const a=A[v];if(!a)return"";return H+`👤 *Situation de ${a.name}*\n\n${M.map(m=>`${P(a,m)?"✅":"❌"} ${m.l}`).join("\n")}\n\n💰 Déjà payé : *${fmt(nb(a)*am)}*\n⏳ Reste à payer : *${fmt((M.length-nb(a))*am)}*\n\nMerci 🙏`}
 const sol=A.filter(a=>nb(a)===M.length),rest=A.filter(a=>nb(a)<M.length);
 return H+`🎓 *RÉCAPITULATIF DE FIN D’ANNÉE*\n\n👥 Agents : ${A.length}\n📆 Période : ${M[0].l} à ${M[M.length-1].l} (${M.length} mois)\n\n*Collecte par mois*\n${M.map(m=>{const c=A.filter(a=>P(a,m)).length;return`• ${m.l} : ${c}/${A.length} agents · ${fmt(c*am)}`}).join("\n")}\n\n✅ *Agents soldés (${sol.length})*\n${list(sol,a=>a.name)}\n\n⚠️ *Reste à payer (${rest.length})*\n${list(rest,a=>`${a.name} : ${fmt((M.length-nb(a))*am)}`)}\n\n💼 *Total collecté : ${fmt(col)}*\n🎯 Objectif : ${fmt(exp)}\n📈 Taux de recouvrement : ${pc} %\n💸 Reste à collecter : ${fmt(exp-col)}\n\nMerci à tous pour votre engagement 🙏`}
function wipe(){modal("Effacer toutes les données",`<p><b>Attention :</b> cette action supprime définitivement <b>toutes les années</b>, tous les agents et tous les paiements enregistrés. Elle est irréversible.</p><p class="sub">Conseil : faites d’abord une « Sauvegarde » pour pouvoir restaurer vos données plus tard.</p><label>Tapez EFFACER pour confirmer</label><input id="wc" autocomplete="off">`,()=>{
  if($("wc").value.trim().toUpperCase()!=="EFFACER"){$("wc").style.borderColor="var(--bad)";return false}
  try{localStorage.removeItem(KEY)}catch(e){}
  db={current:"2026-2027",years:{"2026-2027":mkYear(2026)},seeded:true};save();$("q").value="";render()},"Tout effacer")}
